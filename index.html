<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDRE HOUSE OF FORMATION - Digital Library</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d3b66">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa}
header{background:#0d3b66;color:white;padding:30px 20px;text-align:center}
header h1{margin:0;letter-spacing:3px;font-size:32px}
header p{opacity:0.9;margin-top:5px}
.search{margin:25px auto;max-width:650px;text-align:center;padding:0 15px}
.search input{width:85%;padding:14px 20px;border-radius:30px;border:1px solid #ccc;font-size:16px}
.filters{text-align:center;margin-bottom:10px}
.filters button{margin:5px;padding:8px 18px;border-radius:20px;border:1px solid #0d3b66;background:white;color:#0d3b66;cursor:pointer}
.filters button.active,.filters button:hover{background:#0d3b66;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 3px 10px rgba(0,0,0,0.08);text-align:center;transition:0.2s;overflow:hidden}
.card:hover{transform:translateY(-5px)}
.card img{width:100%;height:220px;object-fit:cover;border-radius:8px;margin-bottom:10px;background:#ddd}
.card .cover{width:100%;height:220px;border-radius:8px;background:linear-gradient(135deg,#0d3b66,#3a86ff);display:flex;align-items:center;justify-content:center;color:white;font-size:42px;font-weight:bold;margin-bottom:10px;text-align:center;padding:10px;box-sizing:border-box;word-break:break-word}
.card .tag{display:inline-block;font-size:11px;padding:4px 10px;border-radius:20px;background:#eef3ff;color:#0d3b66;margin-bottom:8px;font-weight:bold}
.card h3{font-size:15px;color:#222;margin:10px 0;min-height:40px;word-break:break-word}
.card a{background:#0d3b66;color:white;padding:9px 18px;border-radius:25px;text-decoration:none;display:inline-block;margin-top:10px;font-size:14px}
#installBtn{display:none;background:#25D366;color:white;border:none;padding:14px 28px;border-radius:30px;font-size:16px;font-weight:bold;cursor:pointer;margin:20px auto;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
#status{text-align:center;padding:20px;color:#666}
footer{text-align:center;padding:30px;color:#777;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>ANDRE HOUSE OF FORMATION</h1>
<p>Open Digital Library - Tororo City - Auto Mode</p>
<button id="installBtn">📲 INSTALL ALURAIBRARY APP</button>
</header>

<div class="search">
<input type="text" id="searchBox" onkeyup="filterBooks()" placeholder="Search millions of books...">
</div>

<div class="filters">
<button class="active" onclick="filterCategory('ALL',this)">ALL</button>
<button onclick="filterCategory('PHILOSOPHY',this)">Philosophy</button>
<button onclick="filterCategory('SCIENCE',this)">Science</button>
<button onclick="filterCategory('TECHNOLOGY',this)">Technology</button>
<button onclick="filterCategory('ECONOMICS',this)">Economics</button>
<button onclick="filterCategory('EDUCATION',this)">Education</button>
</div>

<div id="status">Loading your library...</div>
<div class="grid" id="bookGrid"></div>
<footer>ALURAIBRARY © 2026 - Tororo City -DONATE TO THE DEVELOPER, OPIO ALFRED (0784038264) to aid in maitaining this library - <span id="count">0</span> Books</footer>

<script>
// PWA INSTALL LOGIC
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') installBtn.style.display = 'none';
    deferredPrompt = null;
  }
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}

const REPO = "alura5070/Aluraibrary";
let allBooks = [];
let currentCat = 'ALL';
async function loadBooks() {
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents?per_page=100`);
    const files = await res.json();
    const pdfs = files.filter(f => f.name.toLowerCase().endsWith('.pdf'));
    document.getElementById('status').innerText = `Found ${pdfs.length} books`;
    document.getElementById('count').innerText = pdfs.length;
    if(pdfs.length===0){document.getElementById('status').innerText='No PDFs found. Upload PDFs!'; return;}
    allBooks = pdfs.map(file => {
      let name = file.name.replace('.pdf','').replace(/[-_]/g,' ');
      let cat = 'EDUCATION';
      if(name.toLowerCase().includes('law') || name.toLowerCase().includes('power')) cat = 'PHILOSOPHY';
      let coverFile = null;
      if(file.name.includes('48-Laws')) coverFile = './cover-48laws.jpg';
      else if(file.name.includes('Canon')) coverFile = './cover-canon.jpg';
      else if(file.name.includes('Legion')) coverFile = './cover-legion.jpg';
      return { title: name, file: file.name, cat: cat, cover: coverFile, search: name.toLowerCase() };
    });
    renderBooks(allBooks);
    setTimeout(()=>{document.getElementById('status').style.display='none';},1000);
  } catch(e){ document.getElementById('status').innerText = 'Loading... Please refresh. ' + e; }
}
function renderBooks(books){
  const grid = document.getElementById('bookGrid');
  grid.innerHTML = '';
  books.forEach(b => {
    let coverHtml = b.cover ? `<img src="${b.cover}" onerror="this.outerHTML='<div class=cover>${b.title.charAt(0)}</div>'">` : `<div class="cover">${b.title.substring(0,2).toUpperCase()}</div>`;
    let card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = b.cat;
    card.innerHTML = `${coverHtml}<span class="tag">${b.cat}</span><h3>${b.title}</h3><a href="./${b.file}" target="_blank">Read / Download</a>`;
    grid.appendChild(card);
  });
}
function filterBooks(){
  let q = document.getElementById('searchBox').value.toLowerCase();
  let filtered = allBooks.filter(b => b.search.includes(q) && (currentCat==='ALL' || b.cat===currentCat));
  renderBooks(filtered);
}
function filterCategory(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterBooks();
}
loadBooks();
</script>
</body>
</html>
