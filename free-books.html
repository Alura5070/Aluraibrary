<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Archives - Direct PDF</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9}
header{background:#0a1931;color:white;padding:15px 20px;position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
nav a{color:white;text-decoration:none;padding:7px 12px;border-radius:20px;font-size:12px;border:1px solid rgba(255,255,255,0.3);margin:2px}
nav a:hover{background:white;color:#0a1931}
.hero{background:linear-gradient(135deg,#0a1931,#185adb);color:white;text-align:center;padding:25px 20px}
.search{margin:-15px auto 10px;max-width:700px;padding:0 15px;text-align:center}
.search input{width:100%;padding:14px 20px;border-radius:30px;border:none;box-shadow:0 8px 25px rgba(0,0,0,0.15)}
.filters{text-align:center;margin:10px}
.filters button{margin:4px;padding:7px 14px;border-radius:20px;border:1px solid #0a1931;background:white;color:#0a1931;cursor:pointer;font-size:11px}
.filters button.active,.filters button:hover{background:#0a1931;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:15px;max-width:1200px;margin:auto}
.card{background:white;border-radius:12px;padding:10px;box-shadow:0 3px 12px rgba(0,0,0,0.07);text-align:center}
.card img{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#eee}
.card .cover{width:100%;height:180px;border-radius:8px;background:linear-gradient(135deg,#0a1931,#185adb);display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:bold}
.card h3{font-size:11px;margin:8px 0;min-height:38px;line-height:1.3}
.tag{font-size:9px;padding:3px 8px;border-radius:12px;background:#e8efff;color:#0a1931;font-weight:bold}
.read-btn{background:#0a1931;color:white;padding:8px 10px;border-radius:20px;text-decoration:none;display:block;font-size:11px;margin-top:6px;font-weight:bold}
.read-btn:hover{background:#185adb}
.read-btn2{background:#25D366;color:white;padding:6px 10px;border-radius:20px;text-decoration:none;display:block;font-size:10px;margin-top:4px}
#status{text-align:center;padding:12px;color:#666;font-size:13px}
</style>
</head>
<body>
<header>
<div><b>ST ANDRE HOUSE DIGITAL LIBRARY</b><br><small>FREE ARCHIVES - DIRECT PDFs</small></div>
<nav>
<a href="index.html">Home</a>
<a href="index.html#books">My Books</a>
</nav>
</header>

<div class="hero">
<h2>ALURA LIBRARY</h2>
<p>100,000+ Books - Open Library</p>
</div>

<div class="search">
<input type="text" id="searchBox" onkeyup="if(this.value.length>2)searchBooks()" placeholder="Search: Philosophy, Theology, Aquinas, Aristotle, Canon Law, Science...">
</div>

<div class="filters">
<button class="active" onclick="loadTopic('theology',this)">THEOLOGY</button>
<button onclick="loadTopic('philosophy',this)">PHILOSOPHY</button>
<button onclick="loadTopic('christianity',this)">CHRISTIAN</button>
<button onclick="loadTopic('canon law',this)">CANON LAW</button>
<button onclick="loadTopic('science',this)">SCIENCE</button>
<button onclick="loadTopic('history',this)">HISTORY</button>
<button onclick="loadTopic('education',this)">EDUCATION</button>
<button onclick="loadTopic('law',this)">LAW</button>
</div>

<div id="status">Loading direct PDFs...</div>
<div class="grid" id="bookGrid"></div>

<script>
let currentBooks = [];
const grid = document.getElementById('bookGrid');
const statusEl = document.getElementById('status');

function getDirectPdfUrl(id){
  // This is the TRUE direct PDF link Gutenberg provides
  return `https://www.gutenberg.org/cache/epub/${id}/pg${id}.pdf`;
}
function getDirectEpubUrl(id){
  return `https://www.gutenberg.org/ebooks/${id}.epub3.images`;
}
function getReadOnlineUrl(id){
  return `https://www.gutenberg.org/ebooks/${id}`;
}

async function loadTopic(topic, btn){
  if(btn){ document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  statusEl.innerText = `Loading ${topic.toUpperCase()} - direct PDFs...`;
  grid.innerHTML = '';
  try{
    const res = await fetch(`https://gutendex.com/books?topic=${encodeURIComponent(topic)}&per_page=500`);
    const data = await res.json();
    let results = data.results;
    if(!results || results.length===0){
      const res2 = await fetch(`https://gutendex.com/books?search=${encodeURIComponent(topic)}&per_page=500`);
      const data2 = await res2.json();
      results = data2.results;
    }
    renderBooks(results, topic);
  }catch(e){
    statusEl.innerText = "Slow internet, try again. Search above for specific book.";
  }
}

function renderBooks(books, topic){
  currentBooks = books;
  statusEl.innerText = `${books.length} ${topic.toUpperCase()} books - All PDF direct - Click to download`;
  grid.innerHTML = '';
  books.forEach(b=>{
    const title = b.title.length>60? b.title.substring(0,60)+'...' : b.title;
    const author = b.authors[0]? b.authors[0].name : '';
    const pdfDirect = getDirectPdfUrl(b.id);
    const epubDirect = getDirectEpubUrl(b.id);
    const cover = b.formats['image/jpeg'] || `https://www.gutenberg.org/cache/epub/${b.id}/pg${b.id}.cover.medium.jpg`;
    
    const card = document.createElement('div');
    card.className='card';
        card.innerHTML = `
      <img src="${cover}" onerror="this.outerHTML='<div class=cover>${b.title.substring(0,2).toUpperCase()}</div>'">
      <span class="tag">${topic.toUpperCase()}</span>
      <h3>${title}<br><small style="color:#777">${author}</small></h3>
      <a class="read-btn" href="https://www.gutenberg.org/ebooks/${b.id}" target="_blank" style="background:#185adb">📖 READ ONLINE</a>
      <a class="read-btn" href="${pdfDirect}" target="_blank" download>📥 DOWNLOAD PDF DIRECT</a>
      <a class="read-btn2" href="${epubDirect}" target="_blank">📱 EPUB</a>
    `;
      <img src="${cover}" onerror="this.outerHTML='<div class=cover>${b.title.substring(0,2).toUpperCase()}</div>'">
      <span class="tag">${topic.toUpperCase()}</span>
      <h3>${title}<br><small style="color:#777">${author}</small></h3>
      <a class="read-btn" href="${pdfDirect}" target="_blank" download>📥 DOWNLOAD PDF DIRECT</a>
      <a class="read-btn2" href="${epubDirect}" target="_blank">📱 EPUB (if PDF fails)</a>
    `;
    grid.appendChild(card);
  });
}

function searchBooks(){
  let q = document.getElementById('searchBox').value;
  if(q.length<3) return;
  statusEl.innerText = `Searching "${q}" in 70,000 books - direct PDF...`;
  fetch(`https://gutendex.com/books?search=${encodeURIComponent(q)}&per_page=32`)
   .then(r=>r.json())
   .then(d=> renderBooks(d.results, q));
}

loadTopic('theology', null);
</script>
</body>
</html>
